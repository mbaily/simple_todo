<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Sign in · Simple Todo</title>
    <link rel="stylesheet" href="{{ request.scope.root_path }}/static/daisyui_test/daisyui-5.7.50.css">
    <link rel="stylesheet" href="{{ request.scope.root_path }}/static/daisyui_test/style.css?v=25">
    <style>
        .login-page { min-height: 100dvh; display: grid; place-items: center; padding: 1rem; }
        .login-card { width: 100%; max-width: 24rem; padding: 1.75rem 1.5rem 1.5rem; border: 1px solid var(--line); border-radius: 0.6rem; background: var(--surface); display: flex; flex-direction: column; gap: 1rem; }
        .login-card .brand { justify-content: center; font-size: 1.6rem; }
        .login-card .brand-symbol { width: 2.2rem; height: 2.2rem; }
        .login-card h1 { margin: 0; text-align: center; font-size: 1rem; font-weight: 500; color: var(--muted); }
        .login-field { display: flex; flex-direction: column; gap: 0.35rem; font-size: 0.9rem; color: var(--muted); }
        .login-field .input { width: 100%; height: 2.6rem; font-size: 1rem; background: var(--surface); border-color: var(--line); color: var(--text); }
        .login-card .btn-primary { height: 2.6rem; font-size: 1rem; }
        .login-error { font-size: 0.9rem; }
    </style>
</head>
<body>
<main class="login-page">
    <form class="login-card" method="POST" action="{{ request.scope.root_path }}/login">
        <span class="brand"><span class="brand-symbol"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span><span>simple<span class="brand-light">todo</span></span></span>
        <h1>Sign in to continue</h1>
        {% if error %}<div role="alert" class="alert alert-error login-error">{{ error }}</div>{% endif %}
        {% if next_url %}<input type="hidden" name="next" value="{{ next_url }}">{% endif %}
        <label class="login-field" for="username">Username<input class="input" type="text" id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" autofocus required></label>
        <label class="login-field" for="password">Password<input class="input" type="password" id="password" name="password" autocomplete="current-password" required></label>
        <button class="btn btn-primary" type="submit">Sign in</button>
    </form>
</main>
</body>
</html>
